<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusLink | Vitrine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex flex-col items-center p-6 py-12">
    <div class="w-full max-w-md flex flex-col items-center">
        <div class="flex flex-col items-center text-center mb-10">
            <div class="p-1 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 shadow-xl mb-4">
                <img id="pub-photo" src="" class="w-32 h-32 rounded-full object-cover border-4 border-black/50">
            </div>
            <h1 id="pub-name" class="text-3xl font-bold"></h1>
            <p id="pub-bio" class="text-zinc-400 mt-2 text-sm px-4"></p>
        </div>
        <div id="pub-links" class="w-full space-y-4"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
